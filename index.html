<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work in Progress!</title>
    <link href="./tailwindcss/output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="pg-bg h-screen grid place-items-center">
    <div
      class="ml-auto mr-auto text-oat-milk font-inter p-8 border border-oat-milk rounded-3xl flex gap-6 sm:gap-11 flex-col sm:flex-row w-75 sm:w-140 backdrop-blur-md shadow-2xl/15 shadow-oat-milk"
    >
      <div class="sm:flex-1 text-oat-milk">
        <h2 class="font-semibold text-2xl mt-0 mb-2">Work in Progress!</h2>
        <p class="font-light text-lg text-balance max-sm:mb-[-8px]">
          This site is still being developed. It should be here soon. Questions?
          Contact me using one of the given options.
        </p>
      </div>
      <div class="bg-oat-milk h-px w-[85%] self-center sm:hidden"></div>
      <div class="bg-oat-milk w-px h-32 self-center m-auto max-sm:hidden"></div>
      <div class="grid grid-cols-2 grid-rows-2 gap-2 sm:flex-none">
        <!-- top-left icon/link -->
        <a
          href="./linkedin/"
          class="size-18 border place-self-end rounded-2xl p-3 grid place-items-center hover:scale-104 transition-scale duration-75"
        >
          <svg class="text-oat-milk size-10" fill="currentColor">
            <use href="./assets/sprite.svg#linkedin" />
          </svg>
        </a>

        <!-- top-right icon/link -->
        <a
          href="https://hackclub.slack.com/team/U0C7HNFTRLK"
          target="_blank"
          class="size-18 border rounded-2xl p-3 grid place-items-center hover:scale-104 transition-scale duration-75"
        >
          <svg class="text-oat-milk size-10" fill="currentColor">
            <use href="./assets/sprite.svg#slack" />
          </svg>
        </a>

        <!-- bottom-left icon/link -->
        <a
          href="https://github.com/git-davidd/workinprogress"
          target="_blank"
          class="size-18 border place-self-end rounded-2xl p-3 grid place-items-center hover:scale-104 transition-scale duration-75"
        >
          <svg class="text-oat-milk size-10" fill="currentColor">
            <use href="./assets/sprite.svg#github" />
          </svg>
        </a>

        <!-- bottom-right icon/link -->
        <a
          href="./phone/"
          class="size-18 border rounded-2xl p-3 grid place-items-center hover:scale-104 transition-scale duration-75"
        >
          <svg class="text-oat-milk size-10" fill="currentColor">
            <use href="./assets/sprite.svg#phone" />
          </svg>
        </a>
        
      </div>
    </div>
  </body>
</html>
